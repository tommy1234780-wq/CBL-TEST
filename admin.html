<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03101f">
<title>CBL 官方推播管理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#123e61,#03101f 55%);color:#eaf6ff}
main{width:min(680px,calc(100% - 32px));margin:48px auto}
.card{padding:28px;border:1px solid #2a6a91;border-radius:24px;background:rgba(3,24,49,.9);box-shadow:0 20px 60px #0006}
h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.5rem)}p{color:#b7d5ed;line-height:1.6}
label{display:block;margin:18px 0 8px;font-weight:700}input,textarea{width:100%;padding:13px 14px;border:1px solid #3b7193;border-radius:12px;background:#071c30;color:#fff;font:inherit}textarea{min-height:130px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:.85rem;color:#8fb6ce;margin-top:6px}
.channel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.channel-option{display:flex;align-items:center;gap:9px;margin:0;padding:10px 11px;border:1px solid #315b78;border-radius:12px;background:#071c30;color:#d8ecf9;font-size:.92rem;font-weight:650;cursor:pointer}.channel-option:has(input:checked){border-color:#79d1ff;background:#0d3452;color:#fff}.channel-option input{width:17px;height:17px;margin:0;accent-color:#79d1ff}.channel-option:first-child{grid-column:1/-1}
button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:999px;background:#79d1ff;color:#03101f;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
#status{min-height:28px;margin:18px 0 0;font-weight:700}.success{color:#8deda8}.error{color:#ff9b9b}
.back{display:inline-block;margin-top:20px;color:#79d1ff}
@media(max-width:540px){.grid{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>CBL 官方推播管理</h1>
<p>選擇通知頻道、輸入訊息後即可發送給已訂閱的使用者。管理金鑰只會在本次瀏覽器請求中使用，不會寫入網頁程式碼。</p>
<div id="push-form">
<label for="admin-key">管理金鑰</label>
<input id="admin-key" type="password" autocomplete="off" required placeholder="輸入 CBL_ADMIN_KEY">
<div class="grid">
<div class="channel-picker">
<label>通知頻道（可複選）</label>
<div class="channel-grid" role="group" aria-label="通知頻道">
<label class="channel-option"><input name="channels" type="checkbox" value="OFFICIAL" checked>CBL 官方通知</label>
<label class="channel-option"><input name="channels" type="checkbox" value="A">戰狼棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="B">神清163棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="C">遊牧者棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="D">好Chill棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="E">台中樂天棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="F">台中NGU棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="G">T.C.W棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="H">創邑棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="I">捷創科技 JTRON</label><label class="channel-option"><input name="channels" type="checkbox" value="J">安穆科技棒球隊</label>
</div>
<p class="hint">同時選多個頻道時，同一位訂閱者仍只會收到一則通知。</p>
</div>
<div><label for="url">點擊後網址（可選）</label><input id="url" type="url" value="https://tommy1234780-wq.github.io/CBL-TEST/"></div>
</div>
<label for="title">通知標題</label><input id="title" required maxlength="80" placeholder="例如：CBL 官方公告">
<label for="body">通知內容</label><textarea id="body" required maxlength="240" placeholder="輸入要推播給訂閱者的訊息"></textarea>
<button id="send" type="button">發送推播</button>
<div id="status" role="status"></div>
</div>
<a class="back" href="./index.html">← 回到 CBL 官網</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://iwwwpgdrasrhmrhncsim.supabase.co";
const SUPABASE_KEY="sb_publishable_2Ko8glEiFB6NfunRyCr_4A_c1c1fvmO";
const SEND_ENDPOINT=SUPABASE_URL+"/functions/v1/push-send";
const form=document.querySelector("#push-form"),send=document.querySelector("#send"),status=document.querySelector("#status");
function show(message,kind){status.textContent=message;status.className=kind||""}
send.addEventListener("click",async()=>{
 send.disabled=true; show("正在發送…");
 try{
  if(!window.supabase?.createClient) throw new Error("Supabase 載入失敗，請重新整理後再試");
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  let {data:{session}}=await client.auth.getSession();
  if(!session){const auth=await client.auth.signInAnonymously();if(auth.error)throw auth.error;session=auth.data.session}
  const channelIds=[...document.querySelectorAll('input[name="channels"]:checked')].map(input=>input.value);
  if(!channelIds.length)throw new Error("請至少選擇一個通知頻道");
  const response=await fetch(SEND_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"x-admin-key":document.querySelector("#admin-key").value},body:JSON.stringify({channelIds,title:document.querySelector("#title").value.trim(),body:document.querySelector("#body").value.trim(),url:document.querySelector("#url").value.trim()})});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||"發送失敗");
  const detail=result.failed ? "；失敗 "+result.failed+" 則（"+Object.entries(result.failures||{}).map(([key,value])=>key+" "+value).join("、")+"）" : "";
  show("完成：找到 "+result.matched+" 位訂閱者，成功送出 "+result.sent+" 則"+detail+"。",result.failed?"error":"success");
 }catch(error){show("發送失敗："+(error.message||"請檢查管理金鑰與 Supabase 設定"),"error")}finally{send.disabled=false}
});
</script>
</body>
</html>
