<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03101f"><title>CBL 官方推播管理</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#123e61,#03101f 55%);color:#eaf6ff}main{width:min(760px,calc(100% - 32px));margin:48px auto}.card{padding:28px;border:1px solid #2a6a91;border-radius:24px;background:rgba(3,24,49,.9);box-shadow:0 20px 60px #0006}h1,h2{margin:0 0 8px}h2{font-size:1.2rem}p{color:#b7d5ed;line-height:1.6}label{display:block;margin:18px 0 8px;font-weight:700}input,textarea{width:100%;padding:13px 14px;border:1px solid #3b7193;border-radius:12px;background:#071c30;color:#fff;font:inherit}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:.85rem;color:#8fb6ce;margin-top:6px}.channel-grid,.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.channel-option,.mode-option{display:flex;align-items:center;gap:9px;margin:0;padding:10px 11px;border:1px solid #315b78;border-radius:12px;background:#071c30;color:#d8ecf9;font-size:.92rem;font-weight:650;cursor:pointer}.channel-option:has(input:checked),.mode-option:has(input:checked){border-color:#79d1ff;background:#0d3452;color:#fff}.channel-option input,.mode-option input{width:17px;height:17px;margin:0;accent-color:#79d1ff}.channel-option:first-child{grid-column:1/-1}button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:999px;background:#79d1ff;color:#03101f;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{margin-top:0;width:auto;padding:9px 14px;background:#163b56;color:#dff4ff}.danger{background:#5b2730;color:#ffdce2}.success{color:#8deda8}.error{color:#ff9b9b}.back{display:inline-block;margin-top:20px;color:#79d1ff}.schedule-box,.auth-box{margin-top:16px;padding:16px;border:1px solid #315b78;border-radius:16px;background:#071c30}.hidden{display:none!important}.list{display:g </style></head><body><main><section class="card"><h1>CBL 官方推播管理</h1><p>管理員專用。登入後可立即發送推播、建立排程與取消待發送排程。</p>
<section id="auth-panel" class="auth-box"><h2>🔐 管理員登入</h2><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="username" placeholder="admin@example.com"><label for="login-password">密碼</label><input id="login-password" type="password" autocomplete="current-password" placeholder="輸入管理員密碼"><button id="login" type="button">登入管理後台</button><div id="auth-status" role="status"></div><div id="bootstrap-wrap" class="hidden"><hr style="border:0;border-top:1px solid #315b78;margin:24px 0"><h2>第一次設定管理員</h2><p class="hint">只會開放一次。使用目前的管理金鑰建立第一個管理員帳號，成功後此入口會永久鎖定。</p><label for="bootstrap-key">目前管理金鑰</label><input id="bootstrap-key" type="password" autocomplete="off" placeholder="輸入目前的 CBL_ADMIN_KEY"><label for="bootstrap-email">管理員 Email</label><input id="bootstrap-email" type="email" autocomplete="email" placeholder="你的管理員 Email"><label for="bootstrap-password">建立密碼</label><input id="bootstrap-password" type="password" autocomplete="new-password" minlength="12" placeholder="至少 12 個字元"><button id="bootstrap" type="button">建立第一個管理員</button></div></section>
<section id="push-form" class="hidden"><div class="account-row"><div><strong id="account-email"></strong><span class="hint">已登入管理員帳號</span></div><button id="logout" class="secondary" type="button">登出</button></div><div class="grid"><div class="channel-picker"><label>通知頻道（可複選）</label><div class="channel-grid" role="group" aria-label="通知頻道"><label class="channel-option"><input name="channels" type="checkbox" value="OFFICIAL" checked>CBL 官方通知</label><label class="channel-option"><input name="channels" type="checkbox" value="A">戰狼棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="B">神清163棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="C">遊牧者棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="D">好Chill棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="E">台中樂天棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="F">台中NGU棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="G">T.C.W棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="H">創邑棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="I">捷創科技 JTRON</label><label class="channel-option"><input name="channels" type="checkbox" value="J">安穆科技棒球隊</label></div><p class="hint">同時選多個頻道時，同一位訂閱者仍只會收到一則通知。</p></div><div><label for="url">點擊後網址（可選）</label><input id="url" type="url" value="https://tommy1234780-wq.github.io/CBL-TEST/"></div></div><label for="title">通知標題</label><input id="title" maxlength="80" placeholder="例如：CBL 官方公告"><label for="body">通知內容</label><textarea id="body" maxlength="240" placeholder="輸入要推播給訂閱者的訊息"></textarea><label>發布方式</label><div class="mode-grid"><label class="mode-option"><input name="mode" type="radio" value="now" checked>立即發布</label><label class="mode-option"><input name="mode" type="radio" value="schedule">排程發布</label></div><div id="schedule-box" class="schedule-box hidden"><label for="scheduled-at" style="margin-top:0">排程時間（台灣時間）</label><input id="scheduled-at" type="datetime-local" step="60"><p class="hint">系統每分鐘檢查一次，到達指定時間後自動發送。</p></div><button id="send" type="button">發送推播</button><div id="status" role="status"></div><div class="toolbar"><div><h2>📅 排程通知</h2><div class="hint">只顯示尚未完成的排程，每 20 秒自動同步。</div></div><button id="refresh" class="secondary" type="button">重新整理</button></div><div id="schedule-list" class="list"><p class="hint">登入後會載入排程。</p></div></section><a class="back" href="./index.html">← 回到 CBL 官網</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://iwwwpgdrasrhmrhncsim.supabase.co",SUPABASE_KEY="sb_publishable_2Ko8glEiFB6NfunRyCr_4A_c1c1fvmO",SEND_ENDPOINT=SUPABASE_URL+"/functions/v1/push-send",SCHEDULE_ENDPOINT=SUPABASE_URL+"/functions/v1/push-schedule",BOOTSTRAP_ENDPOINT=SUPABASE_URL+"/functions/v1/admin-bootstrap";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),authPanel=document.querySelector("#auth-panel"),pushForm=document.querySelector("#push-form"),authStatus=document.querySelector("#auth-status"),bootstrapWrap=document.querySelector("#bootstrap-wrap"),loginBtn=document.querySelector("#login"),bootstrapBtn=document.querySelector("#bootstrap"),logoutBtn=document.querySelector("#logout"),send=document.querySelector("#send"),status=document.querySelector("#status"),scheduleBox=document.querySelector("#schedule-box"),scheduledAt=document.querySelector("#scheduled-at"),list=document.querySelector("#schedule-list"),refresh=document.querySelector("#refresh"),accountEmail=document.querySelector("#account-email");let session=null,knownItems=[],loadingSchedules=false;
const CHANNEL_NAMES={OFFICIAL:"CBL 官方通知",A:"戰狼棒球隊",B:"神清163棒球隊",C:"遊牧者棒球隊",D:"好Chill棒球隊",E:"台中樂天棒球隊",F:"台中NGU棒球隊",G:"T.C.W棒球隊",H:"創邑棒球隊",I:"捷創科技 JTRON",J:"安穆科技棒球隊"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function show(m,k){status.textContent=m;status.className=k||""}function showAuth(m,k){authStatus.textContent=m;authStatus.className=k||""}function formatTaipei(v){return new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v))}function statusText(s){return({pending:"待發送",processing:"發送中",failed:"發送失敗"})[s]||s}function channelText(ids){return(ids||[]).map(id=>CHANNEL_NAMES[id]||id).join("、")}function channels(){return[...document.querySelectorAll('input[name="channels"]:checked')].map(i=>i.value)}function setDefault(){const d=new Date(Date.now()+10*60000);d.setSeconds(0,0);scheduledAt.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);scheduledAt.min=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}
async function ensureAnySession(){let {data:{session:s}}=await client.auth.getSession();if(!s){const r=await client.auth.signInAnonymously();if(r.error)throw r.error;s=r.data.session}return s}
function isAdminSession(s){return !!s?.user?.app_metadata?.admin}function authHeaders(){if(!session?.access_token)throw new Error("請重新登入");return{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token}}
async function checkBootstrap(){try{const s=await ensureAnySession();const r=await fetch(BOOTSTRAP_ENDPOINT+"?t="+Date.now(),{headers:{"Authorization":"Bearer "+s.access_token},cache:"no-store"}),x=await r.json().catch(()=>({}));bootstrapWrap.classList.toggle("hidden",x.bootstrapComplete!==false)}catch(_){bootstrapWrap.classList.add("hidden")}}
async function refreshAuthUI(){const {data:{session:s}}=await client.auth.getSession();session=s;if(isAdminSession(s)){authPanel.classList.add("hidden");pushForm.classList.remove("hidden");accountEmail.textContent=s.user.email||"管理員";await loadSchedules()}else{session=null;pushForm.classList.add("hidden");authPanel.classList.remove("hidden");await checkBootstrap()}}
loginBtn.addEventListener("click",async()=>{loginBtn.disabled=true;showAuth("登入中…");try{const email=document.querySelector("#login-email").value.trim(),password=document.querySelector("#login-password").value;const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.user?.app_metadata?.admin){await client.auth.signOut();throw new Error("此帳號沒有管理員權限")}showAuth("登入成功。","success");await refreshAuthUI()}catch(e){showAuth("登入失敗："+(e.message||"請檢查 Email 與密碼"),"error")}finally{loginBtn.disabled=false}});
bootstrapBtn.addEventListener("click",async()=>{bootstrapBtn.disabled=true;showAuth("建立管理員中…");try{const email=document.querySelector("#bootstrap-email").value.trim(),password=document.querySelector("#bootstrap-password").value,key=document.querySelector("#bootstrap-key").value;if(password.length<12)throw new Error("密碼至少需要 12 個字元");const s=await ensureAnySession();const r=await fetch(BOOTSTRAP_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token,"x-admin-key":key},body:JSON.stringify({email,password})}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error==="unauthorized"?"管理金鑰錯誤":x.error==="bootstrap_already_complete"?"第一個管理員已建立":x.error==="create_admin_failed"?(x.detail||"建立帳號失敗"):x.error||"建立失敗");await client.auth.signOut();const login=await client.auth.signInWithPassword({email,password});if(login.error)throw login.error;showAuth("第一個管理員建立完成。","success");await refreshAuthUI()}catch(e){showAuth("設定失敗："+(e.message||"請稍後再試"),"error")}finally{bootstrapBtn.disabled=false}});
logoutBtn.addEventListener("click",async()=>{await client.auth.signOut();session=null;knownItems=[];showAuth("已登出。","success");await refreshAuthUI()});
function render(){const v=knownItems.filter(x=>["pending","processing","failed"].includes(x.status)).sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));if(!v.length){list.innerHTML='<p class="hint">目前沒有待處理的排程。</p>';return}list.innerHTML=v.map(x=>'<article class="job"><div class="job-top"><div><div class="job-title">'+esc(x.title)+'</div><div class="job-meta">'+esc(formatTaipei(x.scheduled_at))+' ・ '+esc(channelText(x.channel_ids))+' ・ <span class="pill">'+esc(statusText(x.status))+'</span></div></div>'+(x.status==="pending"?'<button class="secondary danger cancel" data-id="'+esc(x.id)+'" type="button">取消排程</button>':'')+'</div><div class="job-body">'+esc(x.body)+'</div></article>').join("");document.querySelectorAll(".cancel").forEach(b=>b.addEventListener("click",()=>cancelSchedule(b.dataset.id)))}
async function loadSchedules({quiet=false}={}){if(loadingSchedules||!session)return;loadingSchedules=true;try{if(!quiet)refresh.disabled=true;const r=await fetch(SCHEDULE_ENDPOINT+"?t="+Date.now(),{headers:authHeaders(),cache:"no-store"}),x=await r.json().catch(()=>({}));if(r.status===403){await client.auth.signOut();throw new Error("管理員權限已失效，請重新登入")}if(!r.ok)throw new Error(x.error||"載入失敗");knownItems=x.items||[];render()}catch(e){if(!quiet)list.innerHTML='<p class="error">載入失敗：'+esc(e.message||"請稍後再試")+'</p>'}finally{loadingSchedules=false;refresh.disabled=false}}
async function cancelSchedule(id){if(!confirm("確定要取消這則排程通知嗎？"))return;try{const r=await fetch(SCHEDULE_ENDPOINT,{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"cancel",id:Number(id)})}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error==="not_pending"?"這筆排程已經不是待發送狀態":x.error||"取消失敗");knownItems=knownItems.map(i=>String(i.id)===String(id)?{...i,status:"cancelled"}:i);render();show("已取消排程。","success");setTimeout(()=>loadSchedules({quiet:true}),300)}catch(e){show("取消失敗："+(e.message||"請稍後再試"),"error")}}
document.querySelectorAll('input[name="mode"]').forEach(i=>i.addEventListener("change",()=>{const s=document.querySelector('input[name="mode"]:checked').value==="schedule";scheduleBox.classList.toggle("hidden",!s);send.textContent=s?"建立排程":"發送推播";if(s&&!scheduledAt.value)setDefault()}));
send.addEventListener("click",async()=>{send.disabled=true;show("處理中…");try{const channelIds=channels();if(!channelIds.length)throw new Error("請至少選擇一個通知頻道");const p={channelIds,title:document.querySelector("#title").value.trim(),body:document.querySelector("#body").value.trim(),url:document.querySelector("#url").value.trim()};if(!p.title||!p.body)throw new Error("請填寫通知標題與內容");const mode=document.querySelector('input[name="mode"]:checked').value;if(mode==="schedule"){if(!scheduledAt.value)throw new Error("請選擇排程時間");const local=new Date(scheduledAt.value);if(!Number.isFinite(local.getTime()))throw new Error("排程時間格式錯誤");p.scheduledAt=local.toISOString();const r=await fetch(SCHEDULE_ENDPOINT,{method:"POST",headers:authHeaders(),body:JSON.stringify(p)}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error==="schedule_must_be_future"?"排程時間必須晚於現在":x.error||"建立排程失敗");knownItems=[x.item,...knownItems.filter(i=>String(i.id)!==String(x.item.id))];render();show("排程完成：將於 "+formatTaipei(x.item.scheduled_at)+" 自動發送。","success");setTimeout(()=>loadSchedules({quiet:true}),500)}else{const r=await fetch(SEND_ENDPOINT,{method:"POST",headers:authHeaders(),body:JSON.stringify(p)}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error==="forbidden"?"管理員權限不足":x.error||"發送失敗");show("完成：找到 "+x.matched+" 位訂閱者，成功送出 "+x.sent+" 則。",x.failed?"error":"success")}}catch(e){show("操作失敗："+(e.message||"請稍後再試"),"error")}finally{send.disabled=false}});
refresh.addEventListener("click",()=>loadSchedules());setInterval(()=>{if(session)loadSchedules({quiet:true})},20000);client.auth.onAuthStateChange((_event,s)=>{session=s;if(!isAdminSession(s)&&!authPanel.classList.contains("hidden"))return;setTimeout(refreshAuthUI,0)});setDefault();refreshAuthUI();
</script></body></html>
