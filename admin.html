<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03101f">
<title>CBL 官方推播管理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#123e61,#03101f 55%);color:#eaf6ff}
main{width:min(760px,calc(100% - 32px));margin:48px auto}.card{padding:28px;border:1px solid #2a6a91;border-radius:24px;background:rgba(3,24,49,.9);box-shadow:0 20px 60px #0006}
h1,h2{margin:0 0 8px}h2{font-size:1.2rem}p{color:#b7d5ed;line-height:1.6}label{display:block;margin:18px 0 8px;font-weight:700}
input,textarea{width:100%;padding:13px 14px;border:1px solid #3b7193;border-radius:12px;background:#071c30;color:#fff;font:inherit}textarea{min-height:130px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:.85rem;color:#8fb6ce;margin-top:6px}.channel-grid,.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
.channel-option,.mode-option{display:flex;align-items:center;gap:9px;margin:0;padding:10px 11px;border:1px solid #315b78;border-radius:12px;background:#071c30;color:#d8ecf9;font-size:.92rem;font-weight:650;cursor:pointer}.channel-option:has(input:checked),.mode-option:has(input:checked){border-color:#79d1ff;background:#0d3452;color:#fff}.channel-option input,.mode-option input{width:17px;height:17px;margin:0;accent-color:#79d1ff}.channel-option:first-child{grid-column:1/-1}
button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:999px;background:#79d1ff;color:#03101f;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{margin-top:0;width:auto;padding:9px 14px;background:#163b56;color:#dff4ff}.danger{background:#5b2730;color:#ffdce2}
#status{min-height:28px;margin:18px 0 0;font-weight:700}.success{color:#8deda8}.error{color:#ff9b9b}.back{display:inline-block;margin-top:20px;color:#79d1ff}.schedule-box{margin-top:16px;padding:16px;border:1px solid #315b78;border-radius:16px;background:#071c30}.hidden{display:none}.list{display:grid;gap:10px;margin-top:14px}.job{padding:14px;border:1px solid #315b78;border-radius:14px;background:#071c30}.job-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.job-title{font-weight:800}.job-meta{margin-top:6px;color:#9fc3db;font-size:.88rem;line-height:1.5}.job-body{margin-top:8px;color:#d7eaf6;white-space:pre-wrap}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#173b54;font-size:.78rem}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:28px}.toolbar button{margin:0}@media(max-width:540px){.grid,.mode-grid{grid-template-columns:1fr}.card{padding:20px}.job-top,.toolbar{align-items:stretch;flex-direction:column}.toolbar button{width:100%}}
</style></head><body><main><section class="card"><h1>CBL 官方推播管理</h1><p>可立即發送，或指定台灣時間排程發布。排程建立後，即使關閉這個頁面也會由伺服器自動發送。</p><div id="push-form"><label for="admin-key">管理金鑰</label><input id="admin-key" type="password" autocomplete="off" required placeholder="輸入 CBL_ADMIN_KEY"><div class="grid"><div class="channel-picker"><label>通知頻道（可複選）</label><div class="channel-grid" role="group" aria-label="通知頻道"><label class="channel-option"><input name="channels" type="checkbox" value="OFFICIAL" checked>CBL 官方通知</label><label class="channel-option"><input name="channels" type="checkbox" value="A">戰狼棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="B">神清163棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="C">遊牧者棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="D">好Chill棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="E">台中樂天棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="F">台中NGU棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="G">T.C.W棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="H">創邑棒球隊</label><label class="channel-option"><input name="channels" type="checkbox" value="I">捷創科技 JTRON</label><label class="channel-option"><input name="channels" type="checkbox" value="J">安穆科技棒球隊</label></div><p class="hint">同時選多個頻道時，同一位訂閱者仍只會收到一則通知。</p></div><div><label for="url">點擊後網址（可選）</label><input id="url" type="url" value="https://tommy1234780-wq.github.io/CBL-TEST/"></div></div><label for="title">通知標題</label><input id="title" required maxlength="80" placeholder="例如：CBL 官方公告"><label for="body">通知內容</label><textarea id="body" required maxlength="240" placeholder="輸入要推播給訂閱者的訊息"></textarea><label>發布方式</label><div class="mode-grid"><label class="mode-option"><input name="mode" type="radio" value="now" checked>立即發布</label><label class="mode-option"><input name="mode" type="radio" value="schedule">排程發布</label></div><div id="schedule-box" class="schedule-box hidden"><label for="scheduled-at" style="margin-top:0">排程時間（台灣時間）</label><input id="scheduled-at" type="datetime-local" step="60"><p class="hint">系統每分鐘檢查一次，到達指定時間後自動發送。</p></div><button id="send" type="button">發送推播</button><div id="status" role="status"></div><div class="toolbar"><div><h2>📅 排程通知</h2><div class="hint">輸入管理金鑰後即可載入與取消排程。</div></div><button id="refresh" class="secondary" type="button">重新整理</button></div><div id="schedule-list" class="list"><p class="hint">尚未載入排程。</p></div></div><a class="back" href="./index.html">← 回到 CBL 官網</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://iwwwpgdrasrhmrhncsim.supabase.co",SUPABASE_KEY="sb_publishable_2Ko8glEiFB6NfunRyCr_4A_c1c1fvmO",SEND_ENDPOINT=SUPABASE_URL+"/functions/v1/push-send",SCHEDULE_ENDPOINT=SUPABASE_URL+"/functions/v1/push-schedule";const send=document.querySelector("#send"),status=document.querySelector("#status"),scheduleBox=document.querySelector("#schedule-box"),scheduledAt=document.querySelector("#scheduled-at"),list=document.querySelector("#schedule-list"),refresh=document.querySelector("#refresh");let session=null;function show(m,k){status.textContent=m;status.className=k||""}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function getSession(){if(session)return session;if(!window.supabase?.createClient)throw new Error("Supabase 載入失敗，請重新整理後再試");const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let r=await client.auth.getSession();session=r.data.session;if(!session){const a=await client.auth.signInAnonymously();if(a.error)throw a.error;session=a.data.session}return session}function headers(){return{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"x-admin-key":document.querySelector("#admin-key").value}}function channels(){return[...document.querySelectorAll('input[name="channels"]:checked')].map(i=>i.value)}function setDefault(){const d=new Date(Date.now()+10*60000);d.setSeconds(0,0);scheduledAt.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);scheduledAt.min=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}
document.querySelectorAll('input[name="mode"]').forEach(i=>i.addEventListener("change",()=>{const s=document.querySelector('input[name="mode"]:checked').value==="schedule";scheduleBox.classList.toggle("hidden",!s);send.textContent=s?"建立排程":"發送推播";if(s&&!scheduledAt.value)setDefault()}));async function loadSchedules(){try{if(!document.querySelector("#admin-key").value){list.innerHTML='<p class="hint">請先輸入管理金鑰。</p>';return}await getSession();refresh.disabled=true;const r=await fetch(SCHEDULE_ENDPOINT,{headers:headers()}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||"載入失敗");render(x.items||[])}catch(e){list.innerHTML='<p class="error">載入失敗：'+esc(e.message||"請檢查管理金鑰")+'</p>'}finally{refresh.disabled=false}}function render(items){const v=items.filter(x=>["pending","processing","failed"].includes(x.status));if(!v.length){list.innerHTML='<p class="hint">目前沒有待處理的排程。</p>';return}list.innerHTML=v.map(x=>{const t=new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(x.scheduled_at));return'<article class="job"><div class="job-top"><div><div class="job-title">'+esc(x.title)+'</div><div class="job-meta">'+esc(t)+' ・ '+esc((x.channel_ids||[]).join("、"))+' ・ <span class="pill">'+esc(x.status)+'</span></div></div>'+(x.status==="pending"?'<button class="secondary danger cancel" data-id="'+x.id+'" type="button">取消</button>':'')+'</div><div class="job-body">'+esc(x.body)+'</div></article>'}).join("");document.querySelectorAll(".cancel").forEach(b=>b.addEventListener("click",()=>cancelSchedule(b.dataset.id)))}async function cancelSchedule(id){if(!confirm("確定要取消這則排程通知嗎？"))return;try{await getSession();const r=await fetch(SCHEDULE_ENDPOINT,{method:"POST",headers:headers(),body:JSON.stringify({action:"cancel",id:Number(id)})}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||"取消失敗");show("已取消排程。","success");await loadSchedules()}catch(e){show("取消失敗："+(e.message||"請稍後再試"),"error")}}
send.addEventListener("click",async()=>{send.disabled=true;show("處理中…");try{await getSession();const channelIds=channels();if(!channelIds.length)throw new Error("請至少選擇一個通知頻道");const p={channelIds,title:document.querySelector("#title").value.trim(),body:document.querySelector("#body").value.trim(),url:document.querySelector("#url").value.trim()};if(!p.title||!p.body)throw new Error("請填寫通知標題與內容");const mode=document.querySelector('input[name="mode"]:checked').value;if(mode==="schedule"){if(!scheduledAt.value)throw new Error("請選擇排程時間");const local=new Date(scheduledAt.value);if(!Number.isFinite(local.getTime()))throw new Error("排程時間格式錯誤");p.scheduledAt=local.toISOString();const r=await fetch(SCHEDULE_ENDPOINT,{method:"POST",headers:headers(),body:JSON.stringify(p)}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error==="schedule_must_be_future"?"排程時間必須晚於現在":x.error||"建立排程失敗");const t=new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",dateStyle:"medium",timeStyle:"short"}).format(new Date(x.item.scheduled_at));show("排程完成：將於 "+t+" 自動發送。","success");await loadSchedules()}else{const r=await fetch(SEND_ENDPOINT,{method:"POST",headers:headers(),body:JSON.stringify(p)}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||"發送失敗");const d=x.failed?"；失敗 "+x.failed+" 則（"+Object.entries(x.failures||{}).map(([k,v])=>k+" "+v).join("、")+"）":"";show("完成：找到 "+x.matched+" 位訂閱者，成功送出 "+x.sent+" 則"+d+"。",x.failed?"error":"success")}}catch(e){show("操作失敗："+(e.message||"請檢查管理金鑰與 Supabase 設定"),"error")}finally{send.disabled=false}});refresh.addEventListener("click",loadSchedules);document.querySelector("#admin-key").addEventListener("change",loadSchedules);setDefault();
</script></body></html>
