<!doctype html>
<html lang="zh-TW"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03101f"><title>CBL 賽事內容管理</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#1b4c6b,#03101f 56%);color:#edf8ff}main{width:min(960px,calc(100% - 28px));margin:42px auto}.card{padding:26px;border:1px solid #36759b;border-radius:22px;background:#041a2edb;box-shadow:0 20px 60px #0007}h1,h2{margin:0}h1{font-size:clamp(1.7rem,5vw,2.4rem)}h2{font-size:1.2rem}p,.hint{color:#afcee3;line-height:1.6}.hidden{display:none!important}.login{max-width:440px;margin:28px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{margin-top:18px;padding:18px;border:1px solid #2e6587;border-radius:16px;background:#061e33}.asset{padding:14px;border:1px solid #315f7d;border-radius:13px;background:#08243b}.asset strong{display:block}.asset small{color:#9fc2d8}label{display:block;margin:14px 0 7px;font-weight:700}input,select,textarea{width:100%;border:1px solid #397394;border-radius:10px;background:#071c2e;color:#fff;padding:11px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:999px;padding:11px 16px;background:#75d2ff;color:#03101f;font:inherit;font-weight:800;cursor:pointer}.secondary{background:#17445f;color:#e5f6ff}.danger{background:#672b37;color:#ffe0e5}.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border-top:1px solid #25536f}.item:first-child{border-top:0}.item-title{font-weight:800}.item-meta{font-size:.86rem;color:#a8cadd;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-shrink:0}.status{min-height:24px;margin-top:14px;font-weight:700}.success{color:#8be7a4}.error{color:#ff9fa6}.back{display:inline-block;margin-top:20px;color:#80d6ff}@media(max-width:680px){.grid,.asset-grid{grid-template-columns:1fr}.card{padding:18px}.item{align-items:flex-start}.actions{flex-direction:column}}
</style></head><body><main><section class="card">
<div class="bar"><div><h1>CBL 賽事內容管理</h1><p>更新影片、每週戰報、賽程圖與戰績圖；儲存後官網會自動讀取新內容。</p></div><button id="logout" class="secondary hidden" type="button">登出</button></div>
<div id="login-panel" class="login"><label for="email">管理者 Email</label><input id="email" type="email" autocomplete="username"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password"><button id="login" type="button">登入管理後台</button><div id="login-status" class="status"></div></div>
<div id="app" class="hidden">
<section class="panel"><h2>圖片更新</h2><p class="hint">支援 JPG、PNG、WebP，單張上限 5MB。上傳後會直接取代官網對應圖片。</p><div id="asset-grid" class="asset-grid"></div></section>
<section class="panel"><div class="bar"><div><h2>賽事影片</h2><p class="hint">新增 YouTube 連結後，首頁的對應分組會顯示最新三則。</p></div><button id="clear-video" class="secondary" type="button">新增影片</button></div><div class="grid"><div><label for="video-division">分組</label><select id="video-division"><option value="black-hole">黑洞組</option><option value="stellar">恆星組</option></select></div><div><label for="video-order">排序（小的在前）</label><input id="video-order" type="number" value="0"></div></div><label for="video-title">影片標題</label><input id="video-title" maxlength="120" placeholder="例如：G4 戰狼 vs 遊牧者"><label for="video-url">YouTube 連結</label><input id="video-url" type="url" placeholder="https://www.youtube.com/watch?v=..."><div class="bar" style="margin-top:14px"><span id="video-editing" class="hint">正在新增影片</span><button id="save-video" type="button">儲存影片</button></div><div id="video-list"></div></section>
</div>
<a class="back" href="./index.html">← 回到 CBL 官網</a>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://iwwwpgdrasrhmrhncsim.supabase.co",SUPABASE_KEY="sb_publishable_2Ko8glEiFB6NfunRyCr_4A_c1c1fvmO",ENDPOINT=SUPABASE_URL+"/functions/v1/content-manager";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let session=null,content={items:[],assets:[]},editingId=null;
const ASSETS=[["weekly_report","本週賽事戰報"],["black_hole_schedule","黑洞組賽程圖"],["black_hole_standings","黑洞組戰績表"],["stellar_schedule","恆星組賽程圖"],["stellar_standings","恆星組戰績表"]];
const $=s=>document.querySelector(s);function msg(el,text,kind){el.textContent=text;el.className="status "+(kind||"")}function authHeaders(){return{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:"Bearer "+session.access_token}}async function request(body){const r=await fetch(ENDPOINT,{method:"POST",headers:authHeaders(),body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.error||"操作失敗");return d}
async function load(){const r=await fetch(ENDPOINT,{headers:{apikey:SUPABASE_KEY}});content=await r.json();render()}function render(){const assetMap=Object.fromEntries((content.assets||[]).map(a=>[a.asset_key,a]));$("#asset-grid").replaceChildren(...ASSETS.map(([key,label])=>{const box=document.createElement("div");box.className="asset";const title=document.createElement("strong");title.textContent=label;const sub=document.createElement("small");sub.textContent=assetMap[key]?"已設定圖片":"目前使用官網原本圖片";const file=document.createElement("input");file.type="file";file.accept="image/jpeg,image/png,image/webp";const button=document.createElement("button");button.textContent="上傳並替換";button.type="button";button.onclick=()=>uploadAsset(key,label,file,button);box.append(title,sub,file,button);return box}));const list=$("#video-list");list.replaceChildren(...(content.items||[]).filter(x=>x.kind==="video").map(item=>{const row=document.createElement("div");row.className="item";const text=document.createElement("div");const title=document.createElement("div");title.className="item-title";title.textContent=(item.division==="black-hole"?"黑洞組":"恆星組")+"｜"+item.title;const meta=document.createElement("div");meta.className="item-meta";meta.textContent=item.url;text.append(title,meta);const actions=document.createElement("div");actions.className="actions";const edit=document.createElement("button");edit.className="secondary";edit.textContent="編輯";edit.onclick=()=>editVideo(item);const del=document.createElement("button");del.className="danger";del.textContent="刪除";del.onclick=()=>deleteVideo(item);actions.append(edit,del);row.append(text,actions);return row}))}async function uploadAsset(key,label,file,button){if(!file.files[0])return alert("請先選擇圖片");const image=file.files[0];if(image.size>5242880)return alert("圖片不可超過 5MB");button.disabled=true;button.textContent="上傳中…";try{const raw=await image.arrayBuffer(),b64=btoa(String.fromCharCode(...new Uint8Array(raw)));await request({action:"upload_asset",assetKey:key,mime:image.type,base64:b64,altText:label});await load();alert(label+" 已更新")}catch(e){alert("上傳失敗："+e.message)}finally{button.disabled=false;button.textContent="上傳並替換"}}function clearVideo(){editingId=null;$("#video-division").value="black-hole";$("#video-order").value="0";$("#video-title").value="";$("#video-url").value="";$("#video-editing").textContent="正在新增影片"}function editVideo(item){editingId=item.id;$("#video-division").value=item.division;$("#video-order").value=item.sort_order;$("#video-title").value=item.title;$("#video-url").value=item.url;$("#video-editing").textContent="正在編輯 #"+item.id;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}async function saveVideo(){const button=$("#save-video");button.disabled=true;try{await request({action:"save_item",id:editingId,kind:"video",division:$("#video-division").value,title:$("#video-title").value,url:$("#video-url").value,sortOrder:Number($("#video-order").value||0)});clearVideo();await load();alert("影片已儲存")}catch(e){alert("儲存失敗："+e.message)}finally{button.disabled=false}}async function deleteVideo(item){if(!confirm("確定刪除「"+item.title+"」？"))return;try{await request({action:"delete_item",id:item.id});await load()}catch(e){alert("刪除失敗："+e.message)}}async function start(){const {data:{session:s}}=await client.auth.getSession();if(!s)return;session=s;$("#login-panel").classList.add("hidden");$("#app").classList.remove("hidden");$("#logout").classList.remove("hidden");try{await load()}catch(e){alert("無法載入內容："+e.message)}}$("#login").onclick=async()=>{const b=$("#login");b.disabled=true;msg($("#login-status"),"登入中…");const {data,error}=await client.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});b.disabled=false;if(error)return msg($("#login-status"),"登入失敗："+error.message,"error");session=data.session;await start()};$("#logout").onclick=async()=>{await client.auth.signOut();location.reload()};$("#clear-video").onclick=clearVideo;$("#save-video").onclick=saveVideo;start();
</script></body></html>
