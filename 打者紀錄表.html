<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBL 打者成績查詢｜CBL 第三屆官方網站</title>
  <style>
    :root {
      --primary-color:#0d2e50;
      --primary-dark:#06172a;
      --secondary-color:#d8b45a;
      --bg-color:#061321;
      --card-bg:#081a2d;

      --sticky-bg:#0a1d32;

    *{box-sizing:border-box}
    body{

    }
    .container{

    header{

    .controls{
      display:grid;grid-template-columns:minmax(240px,1.7fr) repeat(2,minmax(140px,1fr)) auto auto auto;gap:10px;

    .control-group{display:flex;flex-direction:column;gap:6px}

    input,select,button{
      padding:10px 14px;font-size:15px;border:1px solid var(--border-color);
       border-radius:5px;outline:none;transition:all .2s
    }
    input,select{background:#0c2239;color:var(--text-main)}
    input::placeholder{color:#7890a7}
    input:focus,select:focus{border-color:var(--secondary-color);box-shadow:0 0 0 3px rgba(216,180,90,.12)}
    button{
      background:var(--primary-color);color:#fff;font-weight:700;border:1px solid rgba(216,180,90,.35);
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px
    }
    button:hover{background:#123b61;transform:translateY(-1px)}
    button#toggle-career-view{
      background:#0d2238;color:#f3d27d;border:1px solid rgba(216,180,90,.55)
    }
    button#toggle-career-view:hover{background:#173858;color:#fff3c9}

    .view-switch{display:flex;gap:8px}
    .view-btn{
      border:1px solid rgba(216,180,90,.42);background:#0c2239;color:#c6d6e5;
      padding:8px 13px;border-radius:8px;font-weight:800;cursor:pointer
    }
    .view-btn:hover{background:#143756;color:#fff}
    .view-btn.active{
      background:#f3bf3f;color:#071522;border-color:#f3bf3f;

    }
    .toolbar-action{height:44px;white-space:nowrap}
    .table-guide{display:flex;justify-content:space-between;gap:12px;margin:0 2px 10px;color:var(--text-muted);font-size:12px}

    .table-wrapper{
      overflow:auto;max-height:70vh;border:1px solid var(--border-color);

    table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#07192b}
    thead{position:sticky;top:0;z-index:10}

    }

      padding:11px 10px;border-bottom:1px solid rgba(216,180,90,.16);

    }
    tbody tr:nth-child(even) td{background:#0a2036}

    .player-data-row{cursor:pointer}
    .player-data-row:focus{outline:2px solid var(--secondary-color);outline-offset:-2px}
    th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){position:sticky;z-index:5}

    thead th:nth-child(1),thead th:nth-child(2),thead th:nth-child(3){z-index:11;background:#0b2a49}

    .player-profile-inline{padding:22px;border-top:2px solid rgba(240,90,25,.78);border-bottom:1px solid rgba(216,180,90,.28);background:#071728}

    .mobile-list{display:none}

       border:1px solid rgba(216,180,90,.4);border-radius:8px;background:#071b2f;

    .mobile-summary{
      display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 13px 13px
    }
    .mobile-summary-stat{
      background:var(--panel-soft);border:1px solid rgba(216,180,90,.2);

    }

    .mobile-summary-stat b{font-size:16px;color:#f4ead0}
    .mobile-toggle{
      width:100%;background:#071a2d;color:#b9c9d9;border-radius:0;border:0;

    }

    }

    }

    #loading-overlay{
      position:fixed;inset:0;background:rgba(4,14,24,.88);display:flex;flex-direction:column;

    }

    .spinner{

    }

    @media (max-width:768px){

      .controls{grid-template-columns:1fr}
      .controls .control-group:first-child{grid-column:1/-1}
    }

<body>
<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="margin-top:12px;font-weight:600">資料讀取中...</p>
</div>

<div class="container">
  <header>
    <div>
      <h1>CBL 企業交流聯盟 打者成績</h1>
      <div class="update-info">數據更新時間：<span id="last-updated">讀取中...</span></div>
    </div>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="search">搜尋球員</label>
      <input id="search" type="text" placeholder="輸入姓名..." autocomplete="off" />
    </div>
    <div class="control-group">
      <label for="team">球隊篩選</label>
      <select id="team"><option value="">全部球隊</option></select>
    </div>
    <div class="control-group">
      <label for="season">屆數/賽季</label>
      <select id="season"><option value="">全部屆數</option></select>
    </div>
    <div class="control-group">
      <label>資料範圍</label>
      <button id="toggle-career-view" class="toolbar-action">查看生涯成績</button>
    </div>
    <div class="control-group view-control">
      <label class="view-label">顯示欄位</label>
      <div class="view-switch">
        <button type="button" class="view-btn active" id="simple-view-btn">精簡檢視</button>
        <button type="button" class="view-btn" id="full-view-btn">完整數據</button>
      </div>
    </div>
    <div class="control-group">
      <label>篩選</label>
      <button id="clear-filters" class="toolbar-action" style="background-color:#314b61">重設</button>
    </div>
  </div>

  <div class="table-guide"><span>點選球員可查看當屆、生涯與歷屆紀錄</span><span>點選欄位名稱可切換排序方向</span></div>

  <div class="table-wrapper">
    <table id="table">
      <thead><tr id="header-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="mobile-list" class="mobile-list"></div>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_X5jYPR24dk5oqUSr1py8glTu-jHZJwuzhyJN7RrjMkgkXjwv0hVgmn7KlieQy_-CZEn6UQofqTbz/pub?gid=546432089&single=true&output=csv";

  const searchInput = document.getElementById('search');
  const teamSelect = document.getElementById('team');
  const seasonSelect = document.getElementById('season');
  const clearBtn = document.getElementById('clear-filters');
  const headerRow = document.getElementById('header-row');
  const tbody = document.getElementById('tbody');
  const careerViewBtn = document.getElementById('toggle-career-view');
  const loadingOverlay = document.getElementById('loading-overlay');
  const mobileList = document.getElementById('mobile-list');
  const simpleViewBtn = document.getElementById('simple-view-btn');
  const fullViewBtn = document.getElementById('full-view-btn');

  let originalRows = [], careerStats = [], headers = [];
  let isCareerView = false, isFullView = false;
  let sortKey = '', sortOrder = 'none';
  let selectedProfileKey = '';

  async function main() {
    try {
      const text = await fetchCSV(CSV_URL);
      parseCSV(text);
      extractAndUpdateTime();
      calculateCareerStats();
      buildFilters();
      setupEventListeners();
      render();
      loadingOverlay.style.display = 'none';
    } catch (err) {
      tbody.innerHTML = `<tr><td style="color:#ff8f66;padding:20px">讀取錯誤：${escapeHtml(err.message)}</td></tr>`;
      mobileList.innerHTML = `<div style="color:#ff8f66;padding:20px">讀取錯誤：${escapeHtml(err.message)}</div>`;
      loadingOverlay.style.display = 'none';
    }
  }

  async function fetchCSV(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.text();
  }

  function parseCSV(text) {
    const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim() !== '');
    headers = splitCSVLine(lines[0]).map(h => h.trim());
    originalRows = lines.slice(1).map(line => {
      const cells = splitCSVLine(line);
      const obj = {};
      headers.forEach((h,i) => obj[h] = (cells[i] || '').trim());
      return obj;
    });
  }

  function findKey(candidates, fallback='') {
    return headers.find(h => candidates.some(c => typeof c === 'string' ? h.toUpperCase() === c.toUpperCase() : c.test(h))) || fallback;
  }

  function calculateCareerStats() {
    const nameKey = headers.find(h => h.includes('姓名')) || "背號/姓名";
    const teamKey = headers.find(h => h.includes('隊')) || "隊伍";
    const seasonKey = headers.find(h => h.includes('屆數') || h.includes('屆別') || h.includes('賽季')) || "屆數";
    const nonStatKeys = [nameKey, teamKey, seasonKey];
    const playerStats = new Map();

    for (const row of originalRows) {
      const playerName = row[nameKey]?.trim();
      if (!playerName) continue;
      if (!playerStats.has(playerName)) {
        const newStats = {[nameKey]:playerName,[teamKey]:row[teamKey],[seasonKey]:'生涯累計',lastSeason:row[seasonKey]};
        headers.forEach(h => { if (!nonStatKeys.includes(h)) newStats[h] = Number(row[h]) || 0; });
        playerStats.set(playerName,newStats);
      } else {
        const stats = playerStats.get(playerName);
        if (row[seasonKey] > stats.lastSeason) { stats.lastSeason = row[seasonKey]; stats[teamKey] = row[teamKey]; }
        headers.forEach(h => { if (!nonStatKeys.includes(h)) stats[h] += Number(row[h]) || 0; });
      }
    }

    const ABKey = findKey(['AB',/打數/],'AB');
    const HKey = findKey(['H',/安打總數/,/^安打$/],'H');
    const BBKey = findKey(['BB',/四壞/,/保送/],'BB');
    const HBPKey = findKey(['HBP',/觸身/],'HBP');
    const SFKey = findKey(['SF',/高犧/],'SF');
    const PAKey = findKey(['PA',/打席/],'PA');
    const TBKey = findKey(['TB',/壘打數/],'TB');
    const SOKey = findKey(['SO',/三振/],'SO');
    const avgKey = headers.find(h => h.includes('AVG') || h.includes('打擊率')) || 'AVG';
    const obpKey = headers.find(h => h.includes('OBP') || h.includes('上壘率')) || 'OBP';
    const slgKey = headers.find(h => h.includes('SLG') || h.includes('長打率')) || 'SLG';
    const opsKey = headers.find(h => /OPS|攻擊指數/i.test(h)) || 'OPS';

    careerStats = Array.from(playerStats.values()).map(stats => {
      const AB=stats[ABKey], H=stats[HKey], BB=stats[BBKey], HBP=stats[HBPKey], SF=stats[SFKey], TB=stats[TBKey], PA=stats[PAKey], SO=stats[SOKey];
      stats[avgKey] = AB > 0 ? (H/AB).toFixed(3) : '.000';
      stats[obpKey] = (AB+BB+HBP+SF) > 0 ? ((H+BB+HBP)/(AB+BB+HBP+SF)).toFixed(3) : '.000';
      stats[slgKey] = AB > 0 ? (TB/AB).toFixed(3) : '.000';
      stats[opsKey] = (parseFloat(stats[obpKey]) + parseFloat(stats[slgKey])).toFixed(3);
      const kRateKey = headers.find(h => h.toUpperCase()==='K%' || h==='三振率' || h==='被三振率');
      if (kRateKey) stats[kRateKey] = PA > 0 ? ((SO/PA)*100).toFixed(1)+'%' : '0.0%';
      return stats;
    });
  }

  function getFilteredData() {
    const dataToRender = isCareerView ? careerStats : originalRows;
    const nameKey = searchInput.dataset.nameKey;
    const teamKey = teamSelect.dataset.teamKey;
    const seasonKey = seasonSelect.dataset.seasonKey;
    const kw = searchInput.value.trim().toLowerCase();
    const team = teamSelect.value;
    const season = seasonSelect.value;

    const filtered = dataToRender.filter(r => {
      const passName = kw ? String(r[nameKey] || '').toLowerCase().includes(kw) : true;
      const passTeam = team ? r[teamKey] === team : true;
      const passSeason = isCareerView ? true : (season ? r[seasonKey] === season : true);
      return passName && passTeam && passSeason;
    });

    if (sortKey && sortOrder !== 'none') {
      filtered.sort((a,b) => {
        let valA=a[sortKey], valB=b[sortKey];
        const numA=parseFloat(valA), numB=parseFloat(valB);
        const bothNumeric=Number.isFinite(numA) && Number.isFinite(numB);
        if (bothNumeric) { valA=numA; valB=numB; }
        else { valA=String(valA ?? ''); valB=String(valB ?? ''); }
        if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
        return 0;
      });
    }
    return filtered;
  }

  function render() {
    const filtered = getFilteredData();
    renderHeaders();
    renderBody(filtered);
    renderMobileCards(filtered);
    updateStickyColumns();
    sendHeight();
  }

  function getDisplayHeaders() {
    const AC1_INDEX = 28;
    const seasonKey = headers.find(h => h.includes('屆數') || h.includes('屆別') || h.includes('賽季'));
    const baseHeaders = headers.filter((h,i) => i !== AC1_INDEX && !(isCareerView && h === seasonKey));
    if (isFullView) return baseHeaders;

    const nameKey = searchInput.dataset.nameKey;
    const teamKey = teamSelect.dataset.teamKey;
    const simpleHeaders = [
      seasonKey,
      teamKey,
      nameKey,
      headers.find(h => /AVG|打擊率/i.test(h)),
      findKey(['H',/^安打$/, /安打總數/]),
      findKey(['HR',/^全壘打$/]),
      findKey(['BB',/^四壞$/, /^保送$/]),
      findKey(['SB',/^盜壘$/]),
      headers.find(h => /OPS|攻擊指數/i.test(h))
    ].filter(Boolean);
    return simpleHeaders.filter((header,index) => baseHeaders.includes(header) && simpleHeaders.indexOf(header) === index);
  }

  function classifyHeader(h) {
    if (/AVG|打擊率|OBP|上壘率|SLG|長打率|OPS|攻擊指數/i.test(h)) return 'rate';
    if (/^(2B|3B|HR|全壘打|二壘打|三壘打)$/i.test(h)) return 'power';
    if (/^(BB|SO|K%|四壞|保送|三振|三振率|被三振率)$/i.test(h)) return 'discipline';
    if (/^(SB|CS|盜壘|盜壘刺)$/i.test(h)) return 'running';
    return 'basic';
  }

  function renderHeaders() {
    window.displayHeaders = getDisplayHeaders();
    let prevGroup = null;
    headerRow.innerHTML = window.displayHeaders.map(h => {
      const group = classifyHeader(h);
      const groupStart = prevGroup && group !== prevGroup ? ' group-start' : '';
      prevGroup = group;
      let sortCls = '';
      if (sortKey === h) sortCls = sortOrder === 'asc' ? ' sorted-asc' : ' sorted-desc';
      const ariaSort = sortKey === h ? (sortOrder === 'asc' ? 'ascending' : 'descending') : 'none';
      return `<th class="${sortCls}${groupStart}" data-key="${escapeAttr(h)}" aria-sort="${ariaSort}" title="點擊切換排序方向">${escapeHtml(displayHeaderLabel(h))}<span class="sort-icon"></span></th>`;
    }).join('');
  }

  function renderBody(data) {
    const avgKey = headers.find(h => h.includes('AVG') || h.includes('打擊率'));
    const opsKey = headers.find(h => /OPS|攻擊指數/i.test(h));
    const teamKey = teamSelect.dataset.teamKey;
    const nameKey = searchInput.dataset.nameKey;
    const seasonKey = seasonSelect.dataset.seasonKey;
    tbody.innerHTML = data.map(r => {
      let prevGroup = null;
      const profileKey = `${r[nameKey] || ''}|||${r[seasonKey] || '生涯累計'}`;
      const row = `<tr class="player-data-row${selectedProfileKey === profileKey ? ' selected' : ''}" data-profile-key="${escapeAttr(profileKey)}" tabindex="0" aria-expanded="${selectedProfileKey === profileKey}">` + window.displayHeaders.map(h => {
        const group = classifyHeader(h);
        const groupStart = prevGroup && group !== prevGroup ? ' group-start' : '';
        prevGroup = group;
        let cls = groupStart;
        if (h === avgKey) cls += ' highlight-avg';
        if (h === opsKey) cls += ' highlight-ops';
        const value = r[h] ?? '';
        const content = h === teamKey
          ? `<span class="team-cell"><img src="${teamLogo(value)}" alt=""><span>${escapeHtml(value)}</span></span>`
          : escapeHtml(value);
        return `<td class="${cls.trim()}">${content}</td>`;
      }).join('') + `</tr>`;
      const profile = selectedProfileKey === profileKey
        ? `<tr class="player-profile-row"><td colspan="${Math.max(window.displayHeaders.length,1)}">${buildPlayerProfile(r)}</td></tr>`
        : '';
      return row + profile;
    }).join('') || `<tr><td colspan="${Math.max(window.displayHeaders.length,1)}">查無資料</td></tr>`;
  }

  function renderMobileCards(data) {
    const nameKey = searchInput.dataset.nameKey;
    const teamKey = teamSelect.dataset.teamKey;
    const avgKey = headers.find(h => h.includes('AVG') || h.includes('打擊率'));
    const hKey = findKey(['H',/^安打$/, /安打總數/]);
    const hrKey = findKey(['HR',/^全壘打$/]);
    const bbKey = findKey(['BB',/^四壞$/, /^保送$/]);
    const sbKey = findKey(['SB',/^盜壘$/]);
    const opsKey = headers.find(h => /OPS|攻擊指數/i.test(h));
    const summaryKeys = [hKey,hrKey,bbKey,sbKey,opsKey].filter(Boolean);
    const detailHeaders = getFullDetailHeaders(nameKey,teamKey,summaryKeys,avgKey);

    mobileList.classList.toggle('view-full-mobile',isFullView);
    mobileList.innerHTML = data.map((r,index) => {
      const name = r[nameKey] || '未命名球員';
      const team = r[teamKey] || '';
      const summaries = summaryKeys.map(k => `
        <div class="mobile-summary-stat"><span>${escapeHtml(displayHeaderLabel(k))}</span><b>${escapeHtml(r[k] ?? '')}</b></div>
      `).join('');
      const details = detailHeaders.map(k => `
        <div class="detail-stat"><span>${escapeHtml(k)}</span><b>${escapeHtml(r[k] ?? '')}</b></div>
      `).join('');
      return `
        <article class="mobile-player-card" data-card-index="${index}">
          <div class="mobile-card-head">
            <div class="mobile-player-identity"><img src="${teamLogo(team)}" alt="${escapeHtml(team)} LOGO"><div class="mobile-player-meta"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(team)}</small></div></div>
            <div class="mobile-avg"><small>打擊率</small><strong>${escapeHtml(formatRate(r[avgKey]))}</strong></div>
          </div>
          <div class="mobile-summary">${summaries}</div>
          <button type="button" class="mobile-toggle" data-toggle-card="${index}">
            <span class="open-label">查看生涯與完整數據 ▼</span><span class="close-label">收合球員數據 ▲</span>
          </button>
          <div class="mobile-details">${buildPlayerProfile(r,true)}<section class="profile-section"><div class="profile-section-heading"><strong>完整單季數據</strong><span>${escapeHtml(r[seasonSelect.dataset.seasonKey] || '')}</span></div><div class="mobile-detail-grid">${details}</div></section></div>
        </article>`;
    }).join('') || `<div style="padding:20px;text-align:center;color:var(--text-muted)">查無資料</div>`;
  }

  function getFullDetailHeaders(nameKey,teamKey,summaryKeys,avgKey) {
    const AC1_INDEX=28;
    const seasonKey = seasonSelect.dataset.seasonKey;
    return headers.filter((h,i) =>
      i !== AC1_INDEX && h !== nameKey && h !== teamKey &&
      !(isCareerView && h === seasonKey) && !summaryKeys.includes(h) && h !== avgKey
    );
  }

  function buildPlayerProfile(row, mobile=false) {
    const nameKey=searchInput.dataset.nameKey,teamKey=teamSelect.dataset.teamKey,seasonKey=seasonSelect.dataset.seasonKey;
    const name=row[nameKey] || '未命名球員',team=row[teamKey] || '';
    const career=careerStats.find(item => item[nameKey] === name) || row;
    const history=originalRows.filter(item => item[nameKey] === name).sort((a,b) => String(b[seasonKey] || '').localeCompare(String(a[seasonKey] || ''),'zh-Hant',{numeric:true}));
    const avgKey=headers.find(h => /AVG|打擊率/i.test(h));
    const hKey=findKey(['H',/^安打$/, /安打總數/]);
    const hrKey=findKey(['HR',/^全壘打$/]);
    const bbKey=findKey(['BB',/^四壞$/, /^保送$/]);
    const sbKey=findKey(['SB',/^盜壘$/]);
    const opsKey=headers.find(h => /OPS|攻擊指數/i.test(h));
    const core=[avgKey,hKey,hrKey,bbKey,sbKey,opsKey].filter(Boolean);
    const stats=(source) => core.map(key => `<div class="profile-stat${key === avgKey ? ' primary' : ''}"><span>${escapeHtml(displayHeaderLabel(key))}</span><strong>${escapeHtml(key === avgKey ? formatRate(source[key]) : (source[key] ?? ''))}</strong></div>`).join('');
    const historyRows=history.map(item => `<tr>${[seasonKey,...core].map(key => `<td>${escapeHtml(key === avgKey ? formatRate(item[key]) : (item[key] ?? ''))}</td>`).join('')}</tr>`).join('');
    const head=mobile ? '' : `<div class="profile-head"><img src="${teamLogo(team)}" alt="${escapeHtml(team)} LOGO"><div><h2>${escapeHtml(name)}</h2><p>${escapeHtml(team)} · ${escapeHtml(row[seasonKey] || '生涯累計')}</p></div><span class="profile-role">打者檔案</span></div>`;
    return `<div class="player-profile-inline${mobile ? ' mobile-profile-inline' : ''}">${head}<section class="profile-section"><div class="profile-section-heading"><strong>${isCareerView ? '生涯核心成績' : '當屆核心成績'}</strong><span>${escapeHtml(row[seasonKey] || '生涯累計')}</span></div><div class="profile-stats">${stats(row)}</div></section>${isCareerView ? '' : `<section class="profile-section"><div class="profile-section-heading"><strong>生涯累計</strong><span>${new Set(history.map(item => item[seasonKey])).size} 屆正式紀錄</span></div><div class="profile-stats">${stats(career)}</div></section>`}<section class="profile-section"><div class="profile-section-heading"><strong>歷屆紀錄</strong><span>${history.length} 筆賽季資料</span></div><div class="profile-history-wrap"><table class="profile-history"><thead><tr>${[seasonKey,...core].map(key => `<th>${escapeHtml(key === seasonKey ? '屆數' : displayHeaderLabel(key))}</th>`).join('')}</tr></thead><tbody>${historyRows}</tbody></table></div></section></div>`;
  }

  function formatRate(value) {
    const number=Number.parseFloat(value);
    if(!Number.isFinite(number)) return value || '0.000';
    return number.toFixed(3);
  }

  function setupEventListeners() {
    searchInput.addEventListener('input',() => { selectedProfileKey='';render(); });
    [teamSelect,seasonSelect].forEach(el => el.addEventListener('change',() => { selectedProfileKey='';render(); }));

    clearBtn.addEventListener('click',() => {
      searchInput.value='';
      teamSelect.value='';
      seasonSelect.value=seasonSelect.options[1]?.value || '';
      selectedProfileKey='';
      render();
    });

    careerViewBtn.addEventListener('click',() => {
      isCareerView=!isCareerView;
      careerViewBtn.textContent=isCareerView ? '返回賽季成績' : '查看生涯成績';
      seasonSelect.disabled=isCareerView;
      document.getElementById('table').classList.toggle('career-view-table',isCareerView);
      sortKey='';sortOrder='none';selectedProfileKey='';render();
    });

    simpleViewBtn.addEventListener('click',() => setView(false));
    fullViewBtn.addEventListener('click',() => setView(true));

    headerRow.addEventListener('click',e => {
      const th=e.target.closest('th'); if(!th) return;
      const key=th.dataset.key;
      if(sortKey===key) sortOrder=sortOrder==='desc'?'asc':(sortOrder==='asc'?'none':'desc');
      else {sortKey=key;sortOrder='desc';}
      render();
    });

    tbody.addEventListener('click',e => {
      const row=e.target.closest('.player-data-row'); if(!row) return;
      selectedProfileKey=selectedProfileKey===row.dataset.profileKey ? '' : row.dataset.profileKey;
      render();
    });
    tbody.addEventListener('keydown',e => {
      if(e.key!=='Enter' && e.key!==' ') return;
      const row=e.target.closest('.player-data-row'); if(!row) return;
      e.preventDefault();
      selectedProfileKey=selectedProfileKey===row.dataset.profileKey ? '' : row.dataset.profileKey;
      render();
    });

    mobileList.addEventListener('click',e => {
      const btn=e.target.closest('[data-toggle-card]'); if(!btn) return;
      const card=btn.closest('.mobile-player-card');
      if(card) card.classList.toggle('expanded');
    });

    window.addEventListener('resize',() => { updateStickyColumns(); sendHeight(); });
  }

  function setView(full) {
    isFullView=full;
    simpleViewBtn.classList.toggle('active',!full);
    fullViewBtn.classList.toggle('active',full);
    render();
  }

  function displayHeaderLabel(header) {
    if (/AVG|打擊率/i.test(header)) return '打擊率';
    if (/^(H|安打|安打總數)$/i.test(header)) return '安打';
    if (/^(HR|全壘打)$/i.test(header)) return '全壘打';
    if (/^(BB|四壞|保送)$/i.test(header)) return '保送';
    if (/^(SB|盜壘)$/i.test(header)) return '盜壘';
    if (/OPS|攻擊指數/i.test(header)) return 'OPS';
    return header;
  }

  function teamLogo(team) {
    const value=String(team||'').toLowerCase().replace(/[\s.．·・_-]/g,'').replace(/棒球隊|科技/g,'');
    const rules=[['A',['戰狼']],['B',['神清163','神清']],['C',['遊牧者']],['D',['好chill','好丘']],['E',['台中樂天','樂天']],['F',['台中ngu','ngu']],['G',['tcw','金鋼狼']],['H',['創邑','chungyi']],['I',['捷創','jtron']],['J',['安穆']]];
    const match=rules.find(entry => entry[1].some(alias => value.includes(alias.toLowerCase().replace(/[\s.．·・_-]/g,'').replace(/棒球隊|科技/g,''))));
    return match ? `assets/teams/${match[0]}.webp` : 'assets/season3-main-logo.webp';
  }

  function sendHeight() {
    requestAnimationFrame(() => window.parent.postMessage({type:'cbl-player-data-height',height:document.documentElement.scrollHeight},'*'));
  }

  function buildFilters() {
    const teamKey=headers.find(h => h.includes('隊')) || "隊伍";
    const seasonKey=headers.find(h => h.includes('屆數') || h.includes('屆別') || h.includes('賽季')) || "屆數";
    const nameKey=headers.find(h => h.includes('姓名')) || "背號/姓名";
    const teams=[...new Set(originalRows.map(r => r[teamKey]).filter(Boolean))].sort();
    const seasons=[...new Set(originalRows.map(r => r[seasonKey]).filter(Boolean))].sort().reverse();

    teamSelect.innerHTML='<option value="">全部球隊</option>'+teams.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
    seasonSelect.innerHTML='<option value="">全部屆數</option>'+seasons.map(s => `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');
    seasonSelect.value=seasons[0] || '';
    searchInput.dataset.nameKey=nameKey;
    teamSelect.dataset.teamKey=teamKey;
    seasonSelect.dataset.seasonKey=seasonKey;
  }

  function extractAndUpdateTime() {
    const AC1_INDEX=28,el=document.getElementById('last-updated');
    if(headers[AC1_INDEX]) el.textContent=headers[AC1_INDEX];
  }

  function updateStickyColumns() {
    const ths=document.querySelectorAll('#table th');
    if(ths.length<3) return;
    const w1=ths[0].offsetWidth,w2=ths[1].offsetWidth;
    document.querySelectorAll('#table th:nth-child(1),#table td:nth-child(1)').forEach(e => e.style.left='0px');
    document.querySelectorAll('#table th:nth-child(2),#table td:nth-child(2)').forEach(e => e.style.left=w1+'px');
    document.querySelectorAll('#table th:nth-child(3),#table td:nth-child(3)').forEach(e => e.style.left=(w1+w2)+'px');
  }

  function splitCSVLine(line) {
    const out=[];let cur='',inQuotes=false;
    for(let i=0;i<line.length;i++){
      const c=line[i],n=line[i+1];
      if(c==='"'&&inQuotes&&n==='"'){cur+='"';i++;}
      else if(c==='"') inQuotes=!inQuotes;
      else if(c===','&&!inQuotes){out.push(cur);cur='';}
      else cur+=c;
    }
    out.push(cur);return out;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g,ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }
  function escapeAttr(value) { return escapeHtml(value); }

  main();
</script>
<script src="assets/season3-site.js"></script>
</body>
</html>
