<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBL 投手成績查詢｜CBL 第三屆官方網站</title>
  <style>
    :root {
      --primary-color:#0d2e50; --primary-dark:#06172a; --secondary-color:#d8b45a;
      --bg-color:#061321; --card-bg:#081a2d; --panel-bg:#0b2038; --panel-soft:#102942;
      --text-main:#f3f5f7; --text-muted:#a9bdd1; --border-color:rgba(216,180,90,.34);
      --hover-color:#12314f; --sticky-bg:#0a1d32; --soft-blue:#0d2741; --hot-bg:#182d42;
      --orange:#f05a19;
    }
    *{box-sizing:border-box}
    body{font-family:'Segoe UI',system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:var(--bg-color);color:var(--text-main);line-height:1.6}
    .container{max-width:1400px;margin:20px auto;padding:24px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.24)}
    header{border-bottom:2px solid rgba(216,180,90,.45);margin-bottom:24px;padding-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
    h1{margin:0;font-size:28px;color:#f4d27a;font-weight:800}
    .update-info{font-size:14px;color:var(--text-muted)}
    .note-readonly{background:#11273c;color:#d8e3ee;border-left:4px solid var(--secondary-color);padding:12px 16px;margin-bottom:18px;border-radius:7px;font-size:14px;display:flex;align-items:center;gap:8px}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px;background:var(--panel-bg);padding:16px;border-radius:11px;border:1px solid var(--border-color)}
    .control-group{display:flex;flex-direction:column;gap:6px}
    .control-group label,.view-label{font-size:13px;font-weight:700;color:var(--text-muted)}
    input,select,button{padding:10px 14px;font-size:15px;border:1px solid var(--border-color);border-radius:8px;outline:none;transition:all .2s}
    input,select{background:#0c2239;color:var(--text-main)}
    input::placeholder{color:#7890a7}
    input:focus,select:focus{border-color:var(--secondary-color);box-shadow:0 0 0 3px rgba(216,180,90,.12)}
    button{background:var(--primary-color);color:#fff;font-weight:700;border:1px solid rgba(216,180,90,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
    button:hover{background:#123b61;transform:translateY(-1px)}
    button#toggle-career-view{background:#0d2238;color:#f3d27d;border:1px solid rgba(216,180,90,.55)}
    button#toggle-career-view:hover{background:#173858;color:#fff3c9}
    .view-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel-bg);padding:12px 14px;border-radius:11px;margin-bottom:14px;flex-wrap:wrap;border:1px solid var(--border-color)}
    .view-switch{display:flex;gap:8px}
    .view-btn{border:1px solid rgba(216,180,90,.42);background:#0c2239;color:#c6d6e5;padding:8px 13px;border-radius:8px;font-weight:800;cursor:pointer}
    .view-btn:hover{background:#143756;color:#fff}
    .view-btn.active{background:#f3bf3f;color:#071522;border-color:#f3bf3f;box-shadow:0 4px 12px rgba(243,191,63,.15)}
    .view-hint{font-size:12px;color:var(--text-muted)}
    .table-wrapper{overflow:auto;max-height:70vh;border:1px solid var(--border-color);border-radius:10px;position:relative;background:#07192b}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#07192b}
    thead{position:sticky;top:0;z-index:10}
    th{background:#0b2a49;color:#f4d27a;font-weight:700;padding:12px 10px;text-align:center;white-space:nowrap;cursor:pointer;user-select:none;border-right:1px solid rgba(216,180,90,.18)}
    th:hover{background:#113858}
    td{padding:11px 10px;border-bottom:1px solid rgba(216,180,90,.16);text-align:center;white-space:nowrap;color:#e7eef5;background:#081b2f}
    tbody tr:nth-child(even) td{background:#0a2036}
    tbody tr:hover td{background:var(--hover-color)}
    th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){position:sticky;z-index:5}
    td:nth-child(1),td:nth-child(2),td:nth-child(3){background:var(--sticky-bg);font-weight:600;border-right:1px solid var(--border-color)}
    tbody tr:nth-child(even) td:nth-child(1),tbody tr:nth-child(even) td:nth-child(2),tbody tr:nth-child(even) td:nth-child(3){background:#0b2239}
    thead th:nth-child(1),thead th:nth-child(2),thead th:nth-child(3){z-index:11;background:#0b2a49}
    .highlight-era{color:var(--orange);font-weight:900}
    .highlight-whip{background:#132c43!important;color:#f3d27a;font-weight:900}
    .group-start{border-left:3px solid rgba(216,180,90,.58)!important}
    td.group-start{border-left:3px solid rgba(216,180,90,.28)!important}
    .sort-icon{font-size:10px;margin-left:4px;opacity:.55}
    th.sorted-desc .sort-icon::after{content:" ▼";opacity:1}
    th.sorted-asc .sort-icon::after{content:" ▲";opacity:1}
    .career-view-table td{background:#0d263e;color:#e8f0f7}
    .career-view-table td:nth-child(1),.career-view-table td:nth-child(2),.career-view-table td:nth-child(3){background:#102d49;color:#fff}
    .career-view-table tbody tr:hover td{background:#173b5d;color:#fff}
    .mobile-list{display:none}
    .mobile-player-card{border:1px solid rgba(216,180,90,.4);border-radius:14px;background:#071b2f;overflow:hidden;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
    .mobile-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 10px}
    .mobile-player-meta strong{display:block;font-size:17px;color:#f7f4ea}
    .mobile-player-meta small{display:block;color:var(--text-muted);margin-top:1px}
    .mobile-era{text-align:right}
    .mobile-era small{display:block;color:#aebfd0;font-size:10px;font-weight:800}
    .mobile-era strong{font-size:21px;color:var(--orange)}
    .mobile-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 13px 13px}
    .mobile-summary-stat{background:var(--panel-soft);border:1px solid rgba(216,180,90,.2);border-radius:9px;padding:8px 4px;text-align:center}
    .mobile-summary-stat span,.detail-stat span{display:block;font-size:10px;color:#a9bdd1;font-weight:800}
    .mobile-summary-stat b{font-size:16px;color:#f4ead0}
    .mobile-toggle{width:100%;background:#071a2d;color:#b9c9d9;border-radius:0;border:0;border-top:1px solid rgba(216,180,90,.28);padding:10px;font-size:13px}
    .mobile-toggle:hover{background:#0d2944;color:#f4d27a;transform:none}
    .mobile-details{display:none;background:#0a2239;padding:11px;border-top:1px solid rgba(216,180,90,.16)}
    .mobile-player-card.expanded .mobile-details{display:block}
    .mobile-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .detail-stat{background:#102b46;border:1px solid rgba(216,180,90,.18);border-radius:8px;text-align:center;padding:8px 4px}
    .detail-stat b{color:#edf3f8}
    .mobile-player-card.expanded .mobile-toggle .open-label{display:none}
    .mobile-toggle .close-label{display:none}
    .mobile-player-card.expanded .mobile-toggle .close-label{display:inline}
    .view-full-mobile .mobile-player-card .mobile-details{display:block}
    .view-full-mobile .mobile-player-card .mobile-toggle .open-label{display:none}
    .view-full-mobile .mobile-player-card .mobile-toggle .close-label{display:inline}
    #loading-overlay{position:fixed;inset:0;background:rgba(4,14,24,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000}
    #loading-overlay p{color:#f4d27a!important}
    .spinner{width:40px;height:40px;border:4px solid rgba(216,180,90,.2);border-top:4px solid var(--secondary-color);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:768px){body{background:#061321}.container{margin:0;border-radius:0;padding:14px;background:#06182a;box-shadow:none;border-left:0;border-right:0}header{flex-direction:column;align-items:flex-start;margin-bottom:16px}.controls{grid-template-columns:1fr 1fr;padding:12px}.controls .control-group:first-child{grid-column:1/-1}h1{font-size:20px}.view-toolbar{padding:11px}.view-switch{width:100%}.view-btn{flex:1}.view-hint{display:none}.table-wrapper{display:none}.mobile-list{display:block}.note-readonly{margin-bottom:12px}}
    @media(max-width:480px){.controls{grid-template-columns:1fr}.controls .control-group:first-child{grid-column:auto}}
  </style>

</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p style="margin-top:12px;font-weight:600">資料讀取中...</p></div>
<div class="container">
  <header>
    <div><h1>CBL 企業交流聯盟 投手成績</h1><div class="update-info">數據更新時間：<span id="last-updated">讀取中...</span></div></div>
    <button id="toggle-career-view"><span>📊</span> 查看生涯成績</button>
  </header>
  <div class="note-readonly"><span>ℹ️</span> 提示：此頁面僅供查詢投手成績，使用者無法修改資料。</div>
  <div class="controls">
    <div class="control-group"><label for="search">搜尋球員</label><input id="search" type="text" placeholder="輸入姓名..." autocomplete="off"></div>
    <div class="control-group"><label for="team">球隊篩選</label><select id="team"><option value="">全部球隊</option></select></div>
    <div class="control-group"><label for="season">屆數/賽季</label><select id="season"><option value="">全部屆數</option></select></div>
    <div class="control-group" style="justify-content:flex-end"><label>&nbsp;</label><button id="clear-filters" style="background-color:#314b61">清除篩選</button></div>
  </div>
  <div class="view-toolbar">
    <div><div class="view-label">數據檢視</div><div class="view-switch"><button type="button" class="view-btn active" id="simple-view-btn">精簡檢視</button><button type="button" class="view-btn" id="full-view-btn">完整數據</button></div></div>
    <div class="view-hint">精簡檢視保留核心投手數據；完整數據顯示所有可用欄位。</div>
  </div>
  <div class="table-wrapper"><table id="table"><thead><tr id="header-row"></tr></thead><tbody id="tbody"></tbody></table></div>
  <div id="mobile-list" class="mobile-list"></div>
</div>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTmnSzqJij7qN0DkHrUHSTUbQv609l1OkQU-1BlZqO2t2Jry0zvcMyQa1DpbGKYSXtF94pg2CU-I3X8/pub?gid=1969750057&single=true&output=csv";
const searchInput=document.getElementById('search'),teamSelect=document.getElementById('team'),seasonSelect=document.getElementById('season'),clearBtn=document.getElementById('clear-filters'),headerRow=document.getElementById('header-row'),tbody=document.getElementById('tbody'),careerViewBtn=document.getElementById('toggle-career-view'),loadingOverlay=document.getElementById('loading-overlay'),mobileList=document.getElementById('mobile-list'),simpleViewBtn=document.getElementById('simple-view-btn'),fullViewBtn=document.getElementById('full-view-btn');
let originalRows=[],careerStats=[],headers=[];let isCareerView=false,isFullView=false;let sortKey='',sortOrder='none';
async function main(){try{const text=await fetchCSV(CSV_URL);parseCSV(text);extractAndUpdateTime();calculateCareerStats();buildFilters();setupEventListeners();render();loadingOverlay.style.display='none'}catch(err){tbody.innerHTML=`<tr><td style="color:#ff8f66;padding:20px">讀取錯誤：${escapeHtml(err.message)}</td></tr>`;mobileList.innerHTML=`<div style="color:#ff8f66;padding:20px">讀取錯誤：${escapeHtml(err.message)}</div>`;loadingOverlay.style.display='none'}}
async function fetchCSV(url){const res=await fetch(url);if(!res.ok)throw new Error(`HTTP ${res.status}`);return res.text()}
function parseCSV(text){const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');headers=splitCSVLine(lines[0]).map(h=>h.trim());originalRows=lines.slice(1).map(line=>{const cells=splitCSVLine(line),obj={};headers.forEach((h,i)=>obj[h]=(cells[i]||'').trim());return obj})}
function findKey(candidates,fallback=''){return headers.find(h=>candidates.some(c=>typeof c==='string'?h.toUpperCase()===c.toUpperCase():c.test(h)))||fallback}
function convertIpToDecimal(ipString){if(!ipString)return 0;const parts=String(ipString).split('.');const innings=parseInt(parts[0]||0,10),outs=parseInt(parts[1]||0,10);return innings+(outs/3)}
function calculateCareerStats(){
  const nameKey=headers.find(h=>h.includes('姓名'))||'背號/姓名';
  const teamKey=headers.find(h=>h.includes('隊'))||'隊伍';
  const seasonKey=headers.find(h=>h.includes('屆數')||h.includes('屆別')||h.includes('賽季'))||'屆數';
  const ipKey=headers.find(h=>h.includes('IP')||h.includes('局數'))||'IP';
  const nonStatKeys=[nameKey,teamKey,seasonKey],playerStats=new Map();
  for(const row of originalRows){const playerName=row[nameKey]?.trim();if(!playerName)continue;if(!playerStats.has(playerName)){const newStats={[nameKey]:playerName,[teamKey]:row[teamKey],[seasonKey]:'生涯累計',lastSeason:row[seasonKey]};headers.forEach(h=>{if(!nonStatKeys.includes(h)){newStats[h]=h===ipKey?convertIpToDecimal(row[h]):Number(row[h])||0}});playerStats.set(playerName,newStats)}else{const stats=playerStats.get(playerName);if(row[seasonKey]>stats.lastSeason){stats.lastSeason=row[seasonKey];stats[teamKey]=row[teamKey]}headers.forEach(h=>{if(!nonStatKeys.includes(h)){stats[h]+=h===ipKey?convertIpToDecimal(row[h]):Number(row[h])||0}})}}
  const erKey=headers.find(h=>h.includes('ER')||h.includes('自責分'))||'ER';
  const hKey=headers.find(h=>h==='H'||h.includes('被安打'));
  const bbKey=headers.find(h=>h.includes('BB')||h.includes('四壞')||h.includes('保送'));
  const hbpKey=headers.find(h=>h.includes('HBP')||h.includes('觸身'));
  const eraKey=headers.find(h=>h.includes('ERA')||h.includes('防禦率'))||'ERA';
  const whipKey=headers.find(h=>h.includes('WHIP'))||'WHIP';
  careerStats=Array.from(playerStats.values()).map(stats=>{const totalIP=stats[ipKey]||0,totalER=stats[erKey]||0,totalH=stats[hKey]||0,totalBB=stats[bbKey]||0,totalHBP=stats[hbpKey]||0;const fullInnings=Math.floor(totalIP),outs=Math.round((totalIP-fullInnings)*3);stats[ipKey]=`${fullInnings}.${outs}`;stats[eraKey]=totalIP>0?((totalER/totalIP)*9).toFixed(2):'0.00';stats[whipKey]=totalIP>0?((totalH+totalBB+totalHBP)/totalIP).toFixed(2):'0.00';return stats})
}
function getFilteredData(){const dataToRender=isCareerView?careerStats:originalRows;const nameKey=searchInput.dataset.nameKey,teamKey=teamSelect.dataset.teamKey,seasonKey=seasonSelect.dataset.seasonKey,kw=searchInput.value.trim().toLowerCase(),team=teamSelect.value,season=seasonSelect.value;const filtered=dataToRender.filter(r=>(kw?String(r[nameKey]||'').toLowerCase().includes(kw):true)&&(team?r[teamKey]===team:true)&&(isCareerView?true:(season?r[seasonKey]===season:true)));if(sortKey&&sortOrder!=='none'){filtered.sort((a,b)=>{let valA=a[sortKey],valB=b[sortKey];const isIp=/IP|局數/i.test(sortKey);if(isIp){valA=convertIpToDecimal(valA);valB=convertIpToDecimal(valB)}else{const numA=parseFloat(valA),numB=parseFloat(valB);if(Number.isFinite(numA)&&Number.isFinite(numB)){valA=numA;valB=numB}else{valA=String(valA??'');valB=String(valB??'')}}if(valA<valB)return sortOrder==='asc'?-1:1;if(valA>valB)return sortOrder==='asc'?1:-1;return 0})}return filtered}
function render(){const filtered=getFilteredData();renderHeaders();renderBody(filtered);renderMobileCards(filtered);updateStickyColumns()}
function getDisplayHeaders(){const UPDATE_TIME_INDEX=26;const seasonKey=headers.find(h=>h.includes('屆數')||h.includes('屆別')||h.includes('賽季'));const baseHeaders=headers.filter((h,i)=>i!==UPDATE_TIME_INDEX&&!(isCareerView&&h===seasonKey));if(isFullView)return baseHeaders;const nameKey=searchInput.dataset.nameKey,teamKey=teamSelect.dataset.teamKey;const preferredMatchers=[h=>h===nameKey,h=>h===teamKey,h=>/^(IP|局數)$/i.test(h),h=>/^(W|勝投)$/i.test(h),h=>/^(L|敗投)$/i.test(h),h=>/^(SV|救援|救援成功)$/i.test(h),h=>/^(HLD|中繼|中繼成功)$/i.test(h),h=>/^(SO|K|三振)$/i.test(h),h=>/^(BB|四壞|保送)$/i.test(h),h=>/ERA|防禦率/i.test(h),h=>/WHIP/i.test(h)];const picked=[];preferredMatchers.forEach(match=>{const found=baseHeaders.find(h=>match(h)&&!picked.includes(h));if(found)picked.push(found)});baseHeaders.slice(0,3).forEach(h=>{if(!picked.includes(h))picked.push(h)});return baseHeaders.filter(h=>picked.includes(h))}
function classifyHeader(h){if(/ERA|防禦率|WHIP/i.test(h))return'rate';if(/^(W|L|SV|HLD|勝投|敗投|救援|救援成功|中繼|中繼成功)$/i.test(h))return'result';if(/^(SO|K|BB|HBP|三振|四壞|保送|觸身)$/i.test(h))return'discipline';if(/^(IP|局數|ER|R|H|被安打|自責分)$/i.test(h))return'pitching';return'basic'}
function renderHeaders(){window.displayHeaders=getDisplayHeaders();let prevGroup=null;headerRow.innerHTML=window.displayHeaders.map(h=>{const group=classifyHeader(h),groupStart=prevGroup&&group!==prevGroup?' group-start':'';prevGroup=group;let sortCls='';if(sortKey===h)sortCls=sortOrder==='asc'?' sorted-asc':' sorted-desc';return `<th class="${sortCls}${groupStart}" data-key="${escapeAttr(h)}">${escapeHtml(h)}<span class="sort-icon"></span></th>`}).join('')}
function renderBody(data){const eraKey=headers.find(h=>h.includes('ERA')||h.includes('防禦率')),whipKey=headers.find(h=>h.includes('WHIP'));tbody.innerHTML=data.map(r=>{let prevGroup=null;return'<tr>'+window.displayHeaders.map(h=>{const group=classifyHeader(h),groupStart=prevGroup&&group!==prevGroup?' group-start':'';prevGroup=group;let cls=groupStart;if(h===eraKey)cls+=' highlight-era';if(h===whipKey)cls+=' highlight-whip';return `<td class="${cls.trim()}">${escapeHtml(r[h]??'')}</td>`}).join('')+'</tr>'}).join('')||`<tr><td colspan="${Math.max(window.displayHeaders.length,1)}">查無資料</td></tr>`}
function renderMobileCards(data){const nameKey=searchInput.dataset.nameKey,teamKey=teamSelect.dataset.teamKey;const eraKey=headers.find(h=>h.includes('ERA')||h.includes('防禦率'));const ipKey=findKey(['IP',/局數/]);const wKey=findKey(['W',/^勝投$/]);const lKey=findKey(['L',/^敗投$/]);const svKey=findKey(['SV',/^救援$/, /^救援成功$/]);const soKey=findKey(['SO','K',/^三振$/]);const whipKey=headers.find(h=>h.includes('WHIP'));const summaryKeys=[ipKey,wKey,lKey,svKey,soKey,whipKey].filter(Boolean);const detailHeaders=getFullDetailHeaders(nameKey,teamKey,summaryKeys,eraKey);mobileList.classList.toggle('view-full-mobile',isFullView);mobileList.innerHTML=data.map((r,index)=>{const name=r[nameKey]||'未命名球員',team=r[teamKey]||'',era=eraKey?(r[eraKey]||'0.00'):'';const summaries=summaryKeys.map(k=>`<div class="mobile-summary-stat"><span>${escapeHtml(k)}</span><b>${escapeHtml(r[k]??'')}</b></div>`).join('');const details=detailHeaders.map(k=>`<div class="detail-stat"><span>${escapeHtml(k)}</span><b>${escapeHtml(r[k]??'')}</b></div>`).join('');return `<article class="mobile-player-card" data-card-index="${index}"><div class="mobile-card-head"><div class="mobile-player-meta"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(team)}</small></div><div class="mobile-era"><small>${eraKey?escapeHtml(eraKey):''}</small><strong>${escapeHtml(era)}</strong></div></div><div class="mobile-summary">${summaries}</div><button type="button" class="mobile-toggle" data-toggle-card="${index}"><span class="open-label">查看完整數據 ▼</span><span class="close-label">收合完整數據 ▲</span></button><div class="mobile-details"><div class="mobile-detail-grid">${details}</div></div></article>`}).join('')||`<div style="padding:20px;text-align:center;color:var(--text-muted)">查無資料</div>`}
function getFullDetailHeaders(nameKey,teamKey,summaryKeys,eraKey){const UPDATE_TIME_INDEX=26,seasonKey=seasonSelect.dataset.seasonKey;return headers.filter((h,i)=>i!==UPDATE_TIME_INDEX&&h!==nameKey&&h!==teamKey&&!(isCareerView&&h===seasonKey)&&!summaryKeys.includes(h)&&h!==eraKey)}
function setupEventListeners(){searchInput.addEventListener('input',render);[teamSelect,seasonSelect].forEach(el=>el.addEventListener('change',render));clearBtn.addEventListener('click',()=>{searchInput.value='';teamSelect.value='';seasonSelect.value=seasonSelect.options[1]?.value||'';render()});careerViewBtn.addEventListener('click',()=>{isCareerView=!isCareerView;careerViewBtn.innerHTML=isCareerView?'<span>📅</span> 返回賽季成績':'<span>📊</span> 查看生涯成績';seasonSelect.disabled=isCareerView;document.getElementById('table').classList.toggle('career-view-table',isCareerView);sortKey='';sortOrder='none';render()});simpleViewBtn.addEventListener('click',()=>setView(false));fullViewBtn.addEventListener('click',()=>setView(true));headerRow.addEventListener('click',e=>{const th=e.target.closest('th');if(!th)return;const key=th.dataset.key,defaultAsc=/ERA|WHIP|防禦率/i.test(key);if(sortKey===key)sortOrder=sortOrder==='asc'?'desc':(sortOrder==='desc'?'none':'asc');else{sortKey=key;sortOrder=defaultAsc?'asc':'desc'}render()});mobileList.addEventListener('click',e=>{const btn=e.target.closest('[data-toggle-card]');if(!btn)return;const card=btn.closest('.mobile-player-card');if(card)card.classList.toggle('expanded')});window.addEventListener('resize',updateStickyColumns)}
function setView(full){isFullView=full;simpleViewBtn.classList.toggle('active',!full);fullViewBtn.classList.toggle('active',full);render()}
function buildFilters(){const teamKey=headers.find(h=>h.includes('隊'))||'隊伍',seasonKey=headers.find(h=>h.includes('屆數')||h.includes('屆別')||h.includes('賽季'))||'屆數',nameKey=headers.find(h=>h.includes('姓名'))||'背號/姓名';const teams=[...new Set(originalRows.map(r=>r[teamKey]).filter(Boolean))].sort(),seasons=[...new Set(originalRows.map(r=>r[seasonKey]).filter(Boolean))].sort().reverse();teamSelect.innerHTML='<option value="">全部球隊</option>'+teams.map(t=>`<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');seasonSelect.innerHTML='<option value="">全部屆數</option>'+seasons.map(s=>`<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');seasonSelect.value=seasons[0]||'';searchInput.dataset.nameKey=nameKey;teamSelect.dataset.teamKey=teamKey;seasonSelect.dataset.seasonKey=seasonKey}
function extractAndUpdateTime(){const UPDATE_TIME_INDEX=26,el=document.getElementById('last-updated');if(headers[UPDATE_TIME_INDEX])el.textContent=headers[UPDATE_TIME_INDEX]}
function updateStickyColumns(){const ths=document.querySelectorAll('#table th');if(ths.length<3)return;const w1=ths[0].offsetWidth,w2=ths[1].offsetWidth;document.querySelectorAll('#table th:nth-child(1),#table td:nth-child(1)').forEach(e=>e.style.left='0px');document.querySelectorAll('#table th:nth-child(2),#table td:nth-child(2)').forEach(e=>e.style.left=w1+'px');document.querySelectorAll('#table th:nth-child(3),#table td:nth-child(3)').forEach(e=>e.style.left=(w1+w2)+'px')}
function splitCSVLine(line){const out=[];let cur='',inQuotes=false;for(let i=0;i<line.length;i++){const c=line[i],n=line[i+1];if(c==='"'&&inQuotes&&n==='"'){cur+='"';i++}else if(c==='"')inQuotes=!inQuotes;else if(c===','&&!inQuotes){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]))}
function escapeAttr(value){return escapeHtml(value)}
main();
</script>
