<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020914">
  <title>選手數據中心｜CBL 第三屆官方網站</title>
  <link rel="icon" href="assets/season3-main-logo.webp">
  <link rel="stylesheet" href="assets/season3-site.css">
  <link rel="stylesheet" href="assets/player-data-center.css">
  <link rel="stylesheet" href="assets/player-data-contrast.css">
</head>
<body class="player-data-page">
  <header class="header">
    <div class="title-group">
      <img src="assets/season3-main-logo.webp" alt="CBL 第三屆官方主 LOGO">
      <h1>選手數據中心</h1>
    </div>
    <button class="menu-toggle" type="button" onclick="toggleMenu()">&#9776;</button>
  </header>
  <nav class="navbar" aria-label="主要導覽">
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">首頁</a></li>
      <li><a href="賽程戰績表.html">賽程戰績表</a></li>
      <li><a href="數據統計.html">選手數據查詢</a></li>
      <li><a href="打者排行榜.html">打者排行榜</a></li>
      <li><a href="投手排行榜.html">投手排行榜</a></li>
      <li><a href="CBL名人堂.html">CBL名人堂</a></li>
      <li><a href="team_introduction.html">球隊介紹</a></li>
    </ul>
  </nav>

  <main class="data-center-shell">
    <section class="data-center-hero">
      <div class="data-hero-copy">
        <span class="data-eyebrow">CBL PLAYER DATA CENTER</span>
        <h2>找到一名球員，看見他的每一季。</h2>
        <p>查詢當屆表現、生涯累計與歷屆正式紀錄。</p>
      </div>
      <div class="data-division-lockup" aria-label="第三屆雙組識別">
        <div><img src="assets/black-hole-division-logo.webp" alt="黑洞組 LOGO"><span>黑洞組</span></div>
        <div><img src="assets/stellar-division-logo.webp" alt="恆星組 LOGO"><span>恆星組</span></div>
      </div>
    </section>

    <section class="integrated-data-center" aria-label="選手數據查詢">
      <div class="data-type-nav" role="tablist" aria-label="數據類型">
        <button class="active" type="button" data-player-type="hitter" aria-selected="true">打者數據</button>
        <button type="button" data-player-type="pitcher" aria-selected="false">投手數據</button>
      </div>

      <div class="data-query-toolbar">
        <label class="data-search-field">
          <span>搜尋球員</span>
          <input id="player-search" type="search" placeholder="輸入姓名或背號" autocomplete="off">
        </label>
        <label>
          <span>球隊</span>
          <select id="player-team"><option value="">全部球隊</option></select>
        </label>
        <label>
          <span>屆數</span>
          <select id="player-season"><option value="">全部屆數</option></select>
        </label>
        <div class="data-toolbar-group">
          <span>資料範圍</span>
          <button id="career-view-button" type="button">查看生涯成績</button>
        </div>
        <div class="data-toolbar-group data-view-control">
          <span>顯示欄位</span>
          <div class="data-view-switch">
            <button class="active" id="simple-view-button" type="button">精簡</button>
            <button id="full-view-button" type="button">完整</button>
          </div>
        </div>
        <div class="data-toolbar-group data-reset-group">
          <span>篩選</span>
          <button id="reset-data-button" type="button">重設</button>
        </div>
      </div>

      <div class="data-result-bar">
        <div><span id="data-mode-label">打者 · 精簡檢視</span><strong><b id="data-result-count">0</b> 位球員</strong></div>
        <p><span>點選球員查看完整紀錄</span><span>桌機點擊欄位可排序</span><span>更新：<b id="data-updated-time">讀取中</b></span></p>
      </div>

      <div id="data-error" class="data-error" hidden></div>
      <div class="integrated-table-wrap">
        <table id="integrated-player-table">
          <thead><tr id="integrated-header-row"></tr></thead>
          <tbody id="integrated-table-body"></tbody>
        </table>
      </div>
      <div id="data-floating-header" class="data-floating-header" hidden aria-hidden="true">
        <table class="data-floating-table"><thead><tr id="data-floating-header-row"></tr></thead></table>
      </div>
      <div id="integrated-mobile-list" class="integrated-mobile-list"></div>
    </section>
  </main>

  <div id="data-loading" class="data-loading" aria-live="polite"><span></span><p>正式數據讀取中</p></div>

  <script>
    function toggleMenu() {
      document.getElementById("nav-links").classList.toggle("active");
    }
  </script>
  <script src="assets/season3-site.js"></script>
  <script src="assets/player-data-shell.js"></script>
</body>
</html>
