<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#03101f">
  <title>防禦率排行榜｜CBL 第三屆官方網站</title>
  <link rel="icon" href="assets/season3-main-logo.webp">
  <link rel="stylesheet" href="assets/leaderboard.css">
</head>
<body class="leaderboard-detail"
  data-csv="https://docs.google.com/spreadsheets/d/e/2PACX-1vTmnSzqJij7qN0DkHrUHSTUbQv609l1OkQU-1BlZqO2t2Jry0zvcMyQa1DpbGKYSXtF94pg2CU-I3X8/pub?gid=1969750057&single=true&output=csv"
  data-metric="ERA"
  data-metric-label="防禦率"
  data-metric-aliases="防禦率|ERA"
  data-secondary-label="局數"
  data-secondary-aliases="局數"
  data-sort="asc"
  data-decimals="2"
  data-minimum="19"
  data-minimum-aliases="局數"
  data-rule="入選資格：投球局數達 19 局；數值較低者優先"
  data-division="black-hole">
  <header class="ranking-detail-header">
    <div>
      <span class="eyebrow">OFFICIAL PITCHING RANKING</span>
      <h1>防禦率排行榜</h1>
      <p>以失分控制與局數累積，呈現第三屆最穩定的投手壓制力。</p>
    </div>
    <span class="ranking-live-mark">官方即時資料</span>
  </header>

  <div class="ranking-controls">
    <div class="division-tabs" role="tablist" aria-label="組別切換">
      <button class="division-tab active" type="button" data-group="A組" aria-selected="true">
        <img src="assets/black-hole-division-logo.webp" alt="">黑洞組
      </button>
      <button class="division-tab" type="button" data-group="B組" aria-selected="false">
        <img src="assets/stellar-division-logo.webp" alt="">恆星組
      </button>
    </div>
    <p class="ranking-rule" id="ranking-rule"></p>
  </div>

  <div class="ranking-section-heading">
    <span>TOP 3</span>
    <strong id="division-heading"></strong>
    <small>第三屆例行賽</small>
  </div>
  <section class="ranking-podium" id="ranking-podium" aria-label="防禦率排行榜前三名"></section>

  <div class="ranking-table-heading">
    <div><span>COMPLETE RANKING</span><strong>完整排名</strong></div>
    <small id="ranking-updated">官方資料載入中</small>
  </div>
  <div class="ranking-table-wrap">
    <table class="ranking-table">
      <thead>
        <tr><th>排名</th><th>球員</th><th>隊伍</th><th id="secondary-heading"></th><th id="metric-heading"></th></tr>
      </thead>
      <tbody id="ranking-table-body">
        <tr><td colspan="5"><div class="ranking-empty-state"><div><strong>官方資料載入中</strong><span>正在同步第三屆排行榜。</span></div></div></td></tr>
      </tbody>
    </table>
  </div>
  <p class="ranking-status">同分依官方排行榜規則排列；最終名次與資格認定以 CBL 聯盟公告為準。</p>
  <script src="assets/leaderboard.js"></script>
</body>
</html>
